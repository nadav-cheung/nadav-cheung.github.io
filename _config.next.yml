  enable: false
  hits:
    per_page: 10

# 本地搜索
# 依赖: hexo-generator-searchdb
# 默认值: enable: false, trigger: auto (此处有误应为手动), top_n_per_article: 1, unescape: false, preload: false
local_search:
  enable: true
  # auto: 输入即搜索 | manual: 回车或点击搜索按钮
  trigger: auto
  # 每篇文章显示的最大结果数，-1 表示全部
  top_n_per_article: 1
  # 是否反转义 HTML 字符串
  unescape: true
  # 页面加载时预加载搜索数据
  preload: false


