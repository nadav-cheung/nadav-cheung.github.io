# ---------------------------------------------------------------
# CDN 设置
# 文档: https://theme-next.js.org/docs/advanced-settings/vendors
# ---------------------------------------------------------------

vendors:
  # NexT 内部脚本 CDN 来源
  # 可选值: local | jsdelivr | unpkg | cdnjs | custom
  # ⚠️ cdnjs/jsdelivr/unpkg 上可能没有最新版本的文件
  # 建议设为 local 从本地加载，否则主题 JS 可能返回 404
  # 默认值: local
  internal: local
  # 第三方插件 CDN 来源
  # 可选值: local | jsdelivr | unpkg | cdnjs | custom
  # local 需要安装: https://github.com/next-theme/plugins
  # 默认值: cdnjs
  plugins: custom
  # 自定义 CDN URL 模板
  # 可用变量: ${npm_name}, ${version}, ${minified}, ${cdnjs_name}, ${cdnjs_file}
  custom_cdn_url: https://cdnjs.cloudflare.com/ajax/libs/${cdnjs_name}/${version}/${cdnjs_file}
  # 静态资源路径（仅 vendors.internal 为 local 时生效）
  css: css
  js: js
  images: images
