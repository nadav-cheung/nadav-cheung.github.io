tidio:
  enable: false
  key:


# ---------------------------------------------------------------
# CDN 设置
# 文档: https://theme-next.js.org/docs/advanced-settings/vendors
# ---------------------------------------------------------------

vendors:
  # NexT 内部脚本（主题核心 JS）
  # 可选值: local | jsdelivr | unpkg | cdnjs | custom
  # ⚠️ cdnjs/jsdelivr/unpkg 上没有 hexo-theme-next 8.27.0 的文件
  # 必须设为 local 从本地加载，否则主题 JS 返回 404，页面不显示
  internal: local
  # 第三方插件 CDN
  plugins: custom
  # 自定义 CDN URL 模板
  custom_cdn_url: https://cdnjs.cloudflare.com/ajax/libs/${cdnjs_name}/${version}/${cdnjs_file}

# 静态资源路径（仅 vendors.internal 为 local 时 js 路径生效）
css: css
js: js
images: images

# 文章末尾自定义标签
passage_end_tag:
  enabled: true
