# ===============================================================
# NexT 主题配置文件 (Alternate Theme Config)
# 主题版本: hexo-theme-next 8.27.0
# 修改此文件不会导致主题更新时的合并冲突
# 文档: https://theme-next.js.org/docs/getting-started/configuration
# ===============================================================

# ---------------------------------------------------------------
# 主题核心设置
# 文档: https://theme-next.js.org/docs/theme-settings/
# ---------------------------------------------------------------

# 内容缓存，开启后加速生成速度
# 默认值: true
cache:
  enable: true

# 生成后压缩 HTML/CSS/JS
# 默认值: false
# 注意: hexo-optimize 插件也会做压缩，此处关闭避免重复
minify: false

# 自定义文件路径（覆盖主题模板片段）
# 在 source/_data/ 目录下创建对应文件即可覆盖主题默认模板
custom_file_path:
  head: source/_data/head.njk
  sidebar: source/_data/sidebar.njk
  postBodyStart: source/_data/post-body-start.njk
  postBodyEnd: source/_data/post-body-end.njk
  footer: source/_data/footer.njk
  bodyEnd: source/_data/body-end.njk
  variable: source/_data/variables.styl
  style: source/_data/styles.styl


# ---------------------------------------------------------------
# 外观方案
# ---------------------------------------------------------------

# 主题布局方案
# 可选值: Muse | Mist | Pisces | Gemini
# 默认值: Muse
# Muse: 简洁单栏; Mist: 紧凑单栏; Pisces: 双栏; Gemini: 双栏卡片式
scheme: Gemini

# 暗色模式（跟随系统偏好自动切换）
# 默认值: true（v8.27.0 起默认开启）
darkmode: true

# 亮暗模式切换（v8.26.0 新增）
# 使用 CSS light-dark() 函数实现更精确的亮暗色切换
# 默认值: enable: false, check_supports: true
lightdark:
  enable: false
  # 检查浏览器是否支持 light-dark() CSS 函数，不支持则降级为 darkmode
  check_supports: true


# ---------------------------------------------------------------
# 站点信息
# ---------------------------------------------------------------

# 网站图标（favicon）
# 默认值: 主题自带 /images/favicon-*.png
favicon:
  small: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  medium: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  apple_touch_icon: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  safari_pinned_tab: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  #android_manifest: /manifest.json

# 自定义 Logo（不支持 Mist 方案）
# 默认值: 无
custom_logo: #/uploads/custom-logo.png

# Creative Commons 许可协议
# 可选值: by | by-nc | by-nc-nd | by-nc-sa | by-nd | by-sa | cc-zero
# 默认值: license: by-nc-sa, size: small, sidebar: false, post: false
creative_commons:
  license: by-nc-sa
  # big: 大图标 | small: 小图标
  size: small
  # 在侧边栏显示
  sidebar: true
  # 在文章底部显示
  post: true
  # 指定语言获取对应翻译版本，如 deed.zh
  language:

# Open Graph 元数据（社交媒体分享时显示的信息）
# 默认值: enable: true
open_graph:
  enable: true
  options:
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #google_plus: <g+:profile_link>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>


# ---------------------------------------------------------------
# 导航菜单
# 格式: `名称: /链接/ || 图标`
# 图标使用 Font Awesome，参考: https://fontawesome.com/icons
# 默认值: 全部注释（无菜单项）
# ---------------------------------------------------------------

menu:
  home: / || fa fa-home
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user
  #schedule: /schedule/ || fa fa-calendar
  #sitemap: /sitemap.xml || fa fa-sitemap
  #commonweal: /404/ || fa fa-heartbeat

# 菜单图标和徽章
# 默认值: icons: true, badges: false
menu_settings:
  # 显示图标
  icons: true
  # 显示分类/标签数量徽章
  badges: true


# ---------------------------------------------------------------
# 侧边栏设置
# 文档: https://theme-next.js.org/docs/theme-settings/sidebar
# ---------------------------------------------------------------

sidebar:
  # 侧边栏位置
  # 可选值: left | right
  # 默认值: left
  position: left

  # 侧边栏宽度（v8.27.0 新字段名）
  # width_expanded: 单栏模式（Muse | Mist）及移动端的宽度
  #   默认值: 320
  # width_dual_column: 双栏模式（Pisces | Gemini）桌面端的宽度
  #   默认值: 240
  width_expanded: 300
  width_dual_column: 300

  # 侧边栏显示方式（仅对 Muse | Mist 生效，Pisces/Gemini 始终展开）
  # post: 文章页自动展开 | always: 始终展开 | hide: 点击展开 | remove: 完全移除
  # 默认值: post
  display: post

  # 内边距 (px)
  # 默认值: 18
  padding: 18
  # 与顶部菜单栏的偏移量 (px，仅 Pisces | Gemini)
  # 默认值: 12
  offset: 24

# 侧边栏头像
# 默认值: 无头像, rounded: false, rotated: false
avatar:
  url: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  # 圆形头像
  rounded: true
  # 鼠标悬停旋转效果
  rotated: true

# 侧边栏显示文章/分类/标签数量
# 默认值: true
site_state: true

# 社交链接
# 格式: `名称: 链接 || 图标`
# 默认值: 全部注释
social:
  知乎: https://www.zhihu.com/people/nadav-cheung/posts || fab fa-zhihu fa-beat-fade
  GitHub: https://github.com/nadav-cheung || fab fa-github
  G-Mail: mailto:nadav.cheung@gmail.com || fa fa-envelope
  Twitter: https://twitter.com/nadav_cheung || fab fa-twitter
  FB Page: https://www.facebook.com/nadavcheung || fab fa-facebook
  YouTube: https://www.youtube.com/@NadavCheung || fab fa-youtube
  bilibili: https://space.bilibili.com/101980166 || fab fa-bilibili
  ProcessOn: https://www.processon.com/u/5e690116e4b00fb1da107799 || fab a-brands fa-product-hunt fa-beat-fade

social_icons:
  enable: true
  # 仅显示图标不显示文字
  # 默认值: false
  icons_only: true
  # 鼠标悬停动画
  # 默认值: false
  transition: true

# 友情链接
# 默认值: icon: fa fa-globe, layout: block
links_settings:
  icon: fa fa-globe
  # block: 块状排列 | inline: 行内排列
  layout: block

links:
#  rss: ./atom.xml

# 文章目录（TOC）
# 默认值: enable: true, number: true, wrap: false, expand_all: false, max_depth: 6
toc:
  enable: true
  # 自动添加序号
  number: true
  # 标题超宽时换行
  wrap: true
  # 展开所有层级（而非仅当前阅读位置）
  expand_all: true
  # 最大标题深度 (1-6)
  max_depth: 3


# ---------------------------------------------------------------
# 页脚设置
# 文档: https://theme-next.js.org/docs/theme-settings/footer
# ---------------------------------------------------------------

# 多语言切换器
# 默认值: false
language_switcher: false

footer:
  # 建站年份，不设置则使用当前年份
  # 默认值: 无（使用当前年份）
  since: 2023

  # 年份和版权之间的图标
  icon:
    # Font Awesome 图标名称
    # 默认值: fa fa-heart
    name: fa fa-heart
    # 图标动画
    # 默认值: false
    animated: true
    # 图标颜色
    # 默认值: "#ff0000"
    color: "#ff0000"

  # 版权信息，不设置则使用 Hexo _config.yml 中的 author
  # 默认值: 无
  copyright:

  # "Powered by Hexo & NexT" 显示
  # 默认值: true
  powered: false

  # 中国大陆备案信息
  # 默认值: enable: false
  beian:
    enable: true
    # ICP 备案号
    icp: ""
    # 公安备案数字 ID
    gongan_id: 33010802013393
    # 公安备案完整编号
    gongan_num: 浙公网安备33010802013393
    # 公安备案图标 URL
    gongan_icon_url: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/%E5%A4%87%E6%A1%88%E5%9B%BE%E6%A0%87.png


# ---------------------------------------------------------------
# 文章设置
# 文档: https://theme-next.js.org/docs/theme-settings/posts
# ---------------------------------------------------------------

# 使用 front-matter 中的 description 作为摘要
# 默认值: true
excerpt_description: true

# "阅读全文" 按钮
# 默认值: true
read_more_btn: true

# 文章元信息显示
# 默认值: item_text: true, created_at: true, updated_at.enable: true, categories: true
post_meta:
  # 显示文字标签
  item_text: true
  # 显示创建时间
  created_at: true
  updated_at:
    enable: true
    # 仅在更新日期不同于创建日期时显示
    # 默认值: true
    another_day: true
  # 显示分类
  categories: true

# 字数统计和阅读时长
# 依赖: hexo-word-counter
# 默认值: separated_meta: true, item_text_total: false
symbols_count_time:
  # 字数和时间分开显示
  separated_meta: true
  # 在底部统计区显示文字标签
  item_text_total: true
  # 底部显示总字数
  total_symbols: true
  # 底部显示总阅读时长
  total_time: true
  # 排除代码块字数统计
  # 默认值: false
  exclude_codeblock: false
  # 每分钟阅读字数（用于计算阅读时长）
  # 默认值: 275（英文），中文约 300
  wpm: 275
  # 阅读时长单位后缀
  suffix: "mins."

# 使用图标替代 # 号显示标签
# 默认值: false
tag_icon: true

# 打赏设置
# 默认值: enable: false, animation: false
reward_settings:
  enable: true
  animation: false

reward:
  wechatpay: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202401171842413.png
  alipay: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202401171841199.png
  #paypal: /images/paypal.png
  #bitcoin: /images/bitcoin.png

# 关注链接（文章底部）
# 默认值: 全部注释
follow_me:
  知乎: https://www.zhihu.com/people/nadav-cheung/posts || fab fa-zhihu fa-beat-fade
  Telegram: https://t.me/nadav_cheung || fab fa-telegram fa-beat-fade
  ProcessOn: https://www.processon.com/u/5e690116e4b00fb1da107799 || fab a-brands fa-product-hunt fa-beat-fade

# 相关文章推荐
# 依赖: hexo-related-posts 或 hexo-posts-embedding（v8.24.0 新增支持）
# 默认值: enable: false
related_posts:
  enable: true
  icon: fa fa-signs-post

# 在线编辑文章（跳转到 GitHub）
# 默认值: enable: false
post_edit:
  enable: true
  url: https://github.com/nadav-cheung/nadav-cheung.github.io/tree/1.0.x/source/_posts

# 上下篇文章导航
# left: 左右两侧显示 | right: 右侧显示 | false: 关闭
# 默认值: left
post_navigation: left


# ---------------------------------------------------------------
# 自定义页面设置
# 文档: https://theme-next.js.org/docs/theme-settings/custom-pages
# ---------------------------------------------------------------

# 标签云
# 默认值: min: 12, max: 30, amount: 200, orderby: name, order: 1
tagcloud:
  min: 18  # 最小字号 (px)，默认 12
  max: 18  # 最大字号 (px)，默认 30
  amount: 200  # 标签总数，默认 200
  orderby: name  # 排序字段，默认 name
  order: 1  # 排序方向 (1: 升序, -1: 降序)，默认 1

# Google 日历（需配置 calendar_id 和 api_key）
# 默认值: 如下
calendar:
  calendar_id: <required>
  api_key: <required>
  orderBy: startTime
  showLocation: false
  offsetMax: 72
  offsetMin: 4
  showDeleted: false
  singleEvents: true
  maxResults: 250


# ---------------------------------------------------------------
# 杂项设置
# 文档: https://theme-next.js.org/docs/theme-settings/miscellaneous
# ---------------------------------------------------------------

# 预连接 CDN（加速字体和插件加载）
# 默认值: false
preconnect: true

# 文章/页面的文本对齐
# 可选值: start | end | left | right | center | justify | justify-all | match-parent
# 默认值: desktop: justify, mobile: justify
text_align:
  desktop: justify
  mobile: justify

# 移动端窄屏精简布局
# 默认值: false
mobile_layout_economy: true

# 浏览器标签栏颜色（影响移动端浏览器 UI 颜色）
# 默认值: light: "#222", dark: "#222"
theme_color:
  light: "#222"
  dark: "#222"

# 滚动条行为
# 默认值: overlay: false, stable: false
body_scrollbar:
  # 滚动条覆盖内容（不占空间）
  overlay: false
  # 始终显示滚动条（防止内容跳动）
  stable: true

# 代码块设置
# 默认值: theme.light: default, theme.dark: stackoverflow-dark, copy_button.enable: false, fold.enable: false, language: false
codeblock:
  # 代码高亮主题，所有主题: https://theme-next.js.org/highlight/
  theme:
    light: github
    dark: github-dark
  # Prism 主题（使用 PrismJS 时生效）
  prism:
    light: prism
    dark: prism-dark
  # 复制按钮
  copy_button:
    enable: true
    # 样式: default | flat | mac
    # 默认值: 无
    style: mac
  # 代码块折叠（超过指定高度时折叠）
  fold:
    enable: true
    height: 500
  # 显示语言名称（v8.23.1 新增）
  # 默认值: false
  language: true

# 返回顶部按钮
# 默认值: enable: true, sidebar: false, scrollpercent: false
back2top:
  enable: true
  # 放在侧边栏而非右下角
  sidebar: false
  # 显示滚动百分比
  scrollpercent: true

# 阅读进度条（页面顶部）
# 颜色由 styles.styl 中的 CSS 覆盖控制
# 默认值: enable: false
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#555555"
  height: 2px

# 书签功能（记住阅读位置）
# 默认值: enable: false, color: "#222", save: auto
bookmark:
  enable: true
  color: "#222"
  # auto: 自动保存 | manual: 点击图标保存
  save: auto

# GitHub 角标（右上角 "Follow me on GitHub"）
# 默认值: enable: false
github_banner:
  enable: true
  permalink: https://github.com/nadav-cheung


# ---------------------------------------------------------------
# 字体设置
# Google Fonts: https://fonts.google.com
# 注意: 设置过多字体会导致加载缓慢
# 推荐 Web Safe 字体: Arial | Tahoma | Helvetica | Verdana | Georgia 等
# 所有字体都会自动加载 light/normal/bold 及其斜体样式
# 默认值: enable: false, global.family: Lato
# 字号单位为 em，默认 1 (= 16px)
# ---------------------------------------------------------------

font:
  # 启用自定义字体
  enable: false

  # 字体 CDN 地址
  host: https://fonts.googleapis.com

  # 全局字体
  global:
    external: false
    family: Comic Sans MS, cursive
    size: 1

  # 站点标题字体
  title:
    external: false
    family: Comic Sans MS, cursive
    size: 1.5

  # 标题字体 (h1-h6)
  headings:
    external: false
    family: Comic Sans MS, cursive
    size:

  # 文章正文字体
  posts:
    external: false
    family: Comic Sans MS, cursive

  # 代码字体
  codes:
    external: true
    family: JetBrains Mono


# ---------------------------------------------------------------
# SEO 设置
# 文档: https://theme-next.js.org/docs/theme-settings/seo
# ---------------------------------------------------------------

# 首页标题中包含副标题
# 默认值: false
index_with_subtitle: true

# 外部链接 Base64 加密
# 默认值: false
exturl: false
# 加密链接显示图标
# 默认值: true
exturl_icon: true

# 搜索引擎验证码
google_site_verification: 41DFYTaqlcvt6NH_4Vr7A63vQ_2P1c7FZ1ApWzmZfHw
bing_site_verification: B6C94AB83E31A04989BA1C64C29EA774
yandex_site_verification:
baidu_site_verification: codeva-1ldrDhWqJG


# ---------------------------------------------------------------
# 标签插件设置
# 文档: https://theme-next.js.org/docs/tag-plugins/
# ---------------------------------------------------------------

# Note 标签（Bootstrap 风格提示框）
# 默认值: style: simple, icons: false, light_bg_offset: 0
note:
  # 样式: simple | modern | flat | disabled
  style: simple
  icons: false
  # 背景亮度偏移 (%, 对 modern 和 flat 生效，modern: -12~12, flat: -18~6)
  light_bg_offset: 0

# Tabs 标签页
# 默认值: sticky: false, transition.tabs: false, transition.labels: true
tabs:
  # 长内容时导航栏置顶
  sticky: true
  transition:
    tabs: true
    labels: true

# PDF 标签
# 默认值: enable: false, height: 500px
pdf:
  enable: false
  height: 500px

# Mermaid 流程图
# 默认值: enable: false, theme.light: default, theme.dark: dark
# 31 篇 agentscope-book 文章使用 mermaid 流程图
mermaid:
  enable: true
  # 可选主题: default | dark | forest | neutral
  theme:
    light: neutral
    dark: dark

# WaveDrom 数字电路图
# 默认值: false
wavedrom:
  enable: false


# ---------------------------------------------------------------
# 第三方插件和服务
# 文档: https://theme-next.js.org/docs/third-party-services/
# 更多插件: https://github.com/next-theme/awesome-next
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# 数学公式渲染
# 文档: https://theme-next.js.org/docs/third-party-services/math-equations
# 依赖: hexo-filter-mathjax 或 hexo-renderer-kramed
# 注意: 请按文档安装/卸载对应的渲染器
# 默认值: every_page: false, mathjax.enable: false, katex.enable: false
# ---------------------------------------------------------------

math:
  # 是否每页都加载（false 则仅加载 front-matter 中标记 mathjax: true 的页面）
  # 建议设为 false，MathJax ~500KB+，仅公式页面需要
  every_page: false

  mathjax:
    enable: true
    # 可选值: none | ams | all
    tags: none

  katex:
    enable: false
    # 自动复制 KaTeX 公式文本
    copy_tex: false


# ---------------------------------------------------------------
# 外部库
# 文档: https://theme-next.js.org/docs/third-party-services/external-libraries
# ---------------------------------------------------------------

# PJAX - 无刷新页面导航（Ajax 局部加载）
# 默认值: false
pjax: true

# FancyBox - 图片灯箱效果（点击放大）
# 默认值: false
fancybox: true

# Medium Zoom - 图片缩放（与 fancybox 二选一）
# 默认值: false
mediumzoom: false

# 图片懒加载
# 默认值: false
lazyload: true

# 盘古之白 - 自动在中文和半角字符间插入空格
# 默认值: false
pangu: true

# Quicklink - 视口内链接预加载
# 默认值: enable: false, home: false, archive: false, delay: true, timeout: 3000, priority: true
quicklink:
  enable: true
  # 首页启用预加载
  home: true
  # 归档页启用预加载
  archive: true
  # 页面完全加载后再初始化（避免与 PJAX 冲突）
  delay: true
  # 预加载超时时间 (ms)
  timeout: 3000
  # 使用 fetch() API 而非 link[rel=prefetch]（优先级更高）
  priority: true


# ---------------------------------------------------------------
# 动画设置
# 默认值: motion.enable: true, async: false, duration: 200
# 所有可选动画: https://theme-next.js.org/animate/
# ---------------------------------------------------------------

# 页面过渡动画 (Animate.css)
# ⚠️ async: true 会导致某些元素 visibility:hidden 不恢复，建议保持 false
motion:
  enable: true
  async: false
  # 动画持续时间 (ms)
  duration: 200
  transition:
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    # 仅 Pisces | Gemini 生效
    sidebar: fadeInUp

# 页面加载进度条 (Pace)
# 颜色: black | blue | green | orange | pink | purple | red | silver | white | yellow
# 主题: big-counter | bounce | barber-shop | center-atom | center-circle | center-radar | center-simple
#        corner-indicator | fill-left | flat-top | flash | loading-bar | mac-osx | material | minimal
# 默认值: enable: false, color: blue, theme: minimal
pace:
  enable: true
  color: purple
  theme: bounce

# 彩色丝带背景效果 (HTML5 Canvas)
# 默认值: enable: false, size: 300, alpha: 0.6, zIndex: -1
# 禁用以减少 CPU 消耗和 JS 加载
canvas_ribbon:
  enable: false
  size: 300
  alpha: 0.6
  zIndex: -1


