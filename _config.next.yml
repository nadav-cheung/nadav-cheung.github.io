# ===============================================================
# NexT 主题配置文件 (Alternate Theme Config)
# 主题版本: hexo-theme-next 8.27.0
# 修改此文件不会导致主题更新时的合并冲突
# 文档: https://theme-next.js.org/docs/getting-started/configuration
# ===============================================================

# ---------------------------------------------------------------
# 主题核心设置
# 文档: https://theme-next.js.org/docs/theme-settings/
# ---------------------------------------------------------------

# 内容缓存，开启后加速生成速度
cache:
  enable: true

# 生成后压缩 HTML/CSS/JS（注意：hexo-optimize 插件也会做压缩，此处关闭避免重复）
minify: false

# 自定义文件路径（覆盖主题模板片段）
# 在 source/_data/ 目录下创建对应文件即可覆盖主题默认模板
custom_file_path:
  head: source/_data/head.njk
  header: source/_data/header.njk
  sidebar: source/_data/sidebar.njk
  postMeta: source/_data/post-meta.njk
  postBodyStart: source/_data/post-body-start.njk
  postBodyEnd: source/_data/post-body-end.njk
  footer: source/_data/footer.njk
  bodyEnd: source/_data/body-end.njk
  variable: source/_data/variables.styl
  #mixin: source/_data/mixins.styl
  style: source/_data/styles.styl

# ---------------------------------------------------------------
# 外观方案
# ---------------------------------------------------------------

# 可选方案: Muse | Mist | Pisces | Gemini
scheme: Gemini

# 暗色模式（跟随系统偏好自动切换）
darkmode: true

# 亮暗模式切换（8.27.0 新增，默认关闭）
lightdark:
  enable: false
  # 检查浏览器是否支持 light-dark() CSS 函数
  check_supports: true


# ---------------------------------------------------------------
# 站点信息
# ---------------------------------------------------------------

# 网站图标（favicon）
favicon:
  small: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202402051051028.png
  medium: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202402051051028.png
  apple_touch_icon: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202402051051028.png
  safari_pinned_tab: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/logo.svg

# 自定义 Logo（不支持 Mist 方案）
custom_logo: #/uploads/custom-logo.png

# Creative Commons 许可协议
# 可选值: by | by-nc | by-nc-nd | by-nc-sa | by-nd | by-sa | cc-zero
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: true
  post: true
  # 指定语言获取对应翻译版本，如 deed.zh
  language:

# Open Graph 元数据（社交媒体分享时显示的信息）
open_graph:
  enable: true
  options:
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #google_plus: <g+:profile_link>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>


# ---------------------------------------------------------------
# 导航菜单
# 格式: `名称: /链接/ || 图标`
# 图标使用 Font Awesome，参考: https://fontawesome.com/icons
# ---------------------------------------------------------------

menu:
  home: / || fa fa-home
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user

# 菜单图标和徽章（显示分类/标签数量）
menu_settings:
  icons: true
  badges: true


# ---------------------------------------------------------------
# 侧边栏设置
# 文档: https://theme-next.js.org/docs/theme-settings/sidebar
# ---------------------------------------------------------------

sidebar:
  # 侧边栏位置: left | right
  position: left

  # 侧边栏宽度（仅对 Pisces | Gemini 生效）
  # 注意：8.27.0 默认字段名已改为 width_expanded / width_dual_column
  # 当前使用旧字段名 width，主题会兼容但建议更新
  width: 300

  # 侧边栏显示方式（仅对 Muse | Mist 生效）
  # post: 文章页自动展开 | always: 始终展开 | hide: 点击展开 | remove: 完全移除
  display: post

  # 内边距 (px)
  padding: 18
  # 与顶部菜单栏的偏移量 (px，仅 Pisces | Gemini)
  offset: 12

# 侧边栏头像
avatar:
  url: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/avatar.png
  # 圆形头像
  rounded: true
  # 鼠标悬停旋转效果
  rotated: true

# 侧边栏显示文章/分类/标签数量
site_state: true

# 社交链接
# 格式: `名称: 链接 || 图标`
social:
  知乎: https://www.zhihu.com/people/nadav-cheung/posts || fab fa-zhihu fa-beat-fade
  GitHub: https://github.com/nadav-cheung || fab fa-github
  G-Mail: mailto:nadav.cheung@gmail.com || fa fa-envelope
  Twitter: https://twitter.com/nadav_cheung || fab fa-twitter
  FB Page: https://www.facebook.com/nadavcheung || fab fa-facebook
  YouTube: https://www.youtube.com/@NadavCheung || fab fa-youtube
  bilibili: https://space.bilibili.com/101980166 || fab fa-bilibili
  ProcessOn: https://www.processon.com/u/5e690116e4b00fb1da107799 || fab a-brands fa-product-hunt fa-beat-fade

social_icons:
  enable: true
  # 仅显示图标不显示文字
  icons_only: true
  # 鼠标悬停动画
  transition: true

# 友情链接
links_settings:
  icon: fa fa-globe
  layout: block

links:
#  rss: ./atom.xml

# 文章目录（TOC）
toc:
  enable: true
  # 自动添加序号
  number: true
  # 标题超宽时换行
  wrap: false
  # 展开所有层级（而非仅当前阅读位置）
  expand_all: true
  # 最大标题深度 (1-6)
  max_depth: 3


# ---------------------------------------------------------------
# 页脚设置
# 文档: https://theme-next.js.org/docs/theme-settings/footer
# ---------------------------------------------------------------

# 多语言切换器
language_switcher: false

footer:
  # 建站年份，不设置则使用当前年份
  since: 2023

  # 年份和版权之间的图标
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"

  # 版权信息，不设置则使用 Hexo _config.yml 中的 author
  copyright:

  # "Powered by Hexo & NexT" 显示
  powered: false

  # 中国大陆备案信息
  beian:
    enable: true
    icp: ""
    gongan_id: 33010802013393
    gongan_num: 浙公网安备33010802013393
    gongan_icon_url: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/%E5%A4%87%E6%A1%88%E5%9B%BE%E6%A0%87.png


# ---------------------------------------------------------------
# 文章设置
# 文档: https://theme-next.js.org/docs/theme-settings/posts
# ---------------------------------------------------------------

# 使用 front-matter 中的 description 作为摘要
excerpt_description: true

# "阅读全文" 按钮
read_more_btn: true

# 文章元信息显示
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    # 仅在更新日期不同于创建日期时显示
    another_day: true
  categories: true

# 字数统计和阅读时长
# 依赖: hexo-word-counter
symbols_count_time:
  separated_meta: true
  item_text_total: true
  total_symbols: true
  total_time: true
  # 排除代码块字数统计
  exclude_codeblock: false
  # 每分钟阅读字数（用于计算阅读时长）
  wpm: 275
  suffix: "mins."

# 使用图标替代 # 号显示标签
tag_icon: true

# 打赏设置
reward_settings:
  enable: true
  animation: false

reward:
  wechatpay: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202401171842413.png
  alipay: https://cdn.nadav.com.cn/gh/nadav-cheung/img-repo/hexo-blog/202401171841199.png

# 关注链接（文章底部）
follow_me:
  知乎: https://www.zhihu.com/people/nadav-cheung/posts || fab fa-zhihu fa-beat-fade
  Telegram: https://t.me/nadav_cheung || fab fa-telegram fa-beat-fade
  ProcessOn: https://www.processon.com/u/5e690116e4b00fb1da107799 || fab a-brands fa-product-hunt fa-beat-fade

# 相关文章推荐
# 依赖: hexo-related-posts 或 hexo-posts-embedding
related_posts:
  enable: false
  icon: fa fa-signs-post

# 在线编辑文章（跳转到 GitHub）
post_edit:
  enable: false
  url: https://github.com/nadav-cheung/nadav-cheung.github.io/tree/gh-page

# 上下篇文章导航 (left: 两侧 | right: 右侧 | false: 关闭)
post_navigation: left


# ---------------------------------------------------------------
# 自定义页面设置
# 文档: https://theme-next.js.org/docs/theme-settings/custom-pages
# ---------------------------------------------------------------

# 标签云
tagcloud:
  min: 18  # 最小字号 (px)
  max: 18  # 最大字号 (px)
  amount: 200  # 标签总数
  orderby: name  # 排序字段
  order: 1  # 排序方向 (1: 升序)

# Google 日历（需配置 calendar_id 和 api_key）
calendar:
  calendar_id: <required>
  api_key: <required>
  orderBy: startTime
  showLocation: false
  offsetMax: 72
  offsetMin: 4
  showDeleted: false
  singleEvents: true
  maxResults: 250


# ---------------------------------------------------------------
# 杂项设置
# 文档: https://theme-next.js.org/docs/theme-settings/miscellaneous
# ---------------------------------------------------------------

# 预连接 CDN（加速字体和插件加载）
preconnect: true

# 文章/页面的文本对齐
text_align:
  desktop: justify
  mobile: justify

# 移动端窄屏精简布局
mobile_layout_economy: true

# 浏览器标签栏颜色
theme_color:
  light: "#222"
  dark: "#222"

# 滚动条行为
body_scrollbar:
  # 滚动条覆盖内容（不占空间）
  overlay: false
  # 始终显示滚动条（防止内容跳动）
  stable: true

# 代码块设置
codeblock:
  # 代码高亮主题，所有主题: https://theme-next.js.org/highlight/
  theme:
    light: github
    dark: github-dark
  prism:
    light: prism
    dark: prism-dark
  # 复制按钮
  copy_button:
    enable: true
    # 样式: default | flat | mac
    style: mac
  # 代码块折叠（超过指定高度时折叠）
  fold:
    enable: true
    height: 500
  # 显示语言名称（8.27.0 新增，默认关闭）
  language: false

# 返回顶部按钮
back2top:
  enable: true
  # 放在侧边栏而非右下角
  sidebar: false
  # 显示滚动百分比
  scrollpercent: true

# 阅读进度条（页面顶部）
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px

# 书签功能（记住阅读位置）
bookmark:
  enable: true
  color: "#222"
  # auto: 自动保存 | manual: 点击图标保存
  save: auto

# GitHub 角标（右上角 "Follow me on GitHub"）
github_banner:
  enable: true
  permalink: https://github.com/nadav-cheung


# ---------------------------------------------------------------
# 字体设置
# Google Fonts: https://fonts.google.com
# 注意：设置过多字体会导致加载缓慢
# 推荐 Web Safe 字体: Arial | Tahoma | Helvetica | Verdana | Georgia 等
# ---------------------------------------------------------------

font:
  enable: true

  # 字体 CDN 地址
  host: https://fonts.googleapis.com

  # 全局字体（<body> 内所有元素）
  global:
    external: true
    family: Comic Sans MS
    size:

  # 站点标题字体
  title:
    external: true
    family:
    size:

  # 标题字体 (h1-h6)
  headings:
    external: true
    family:
    size:

  # 文章正文字体
  posts:
    external: true
    family:

  # 代码字体
  codes:
    external: true
    family:


# ---------------------------------------------------------------
# SEO 设置
# 文档: https://theme-next.js.org/docs/theme-settings/seo
# ---------------------------------------------------------------

# 首页标题中包含副标题
index_with_subtitle: true

# 外部链接 Base64 加密
exturl: false
exturl_icon: true

# 搜索引擎验证码
google_site_verification: 41DFYTaqlcvt6NH_4Vr7A63vQ_2P1c7FZ1ApWzmZfHw
bing_site_verification: B6C94AB83E31A04989BA1C64C29EA774
yandex_site_verification:
baidu_site_verification: codeva-1ldrDhWqJG


# ---------------------------------------------------------------
# 标签插件设置
# 文档: https://theme-next.js.org/docs/tag-plugins/
# ---------------------------------------------------------------

# Note 标签（Bootstrap 风格提示框）
note:
  # 样式: simple | modern | flat | disabled
  style: simple
  icons: false
  light_bg_offset: 0

# Tabs 标签页
tabs:
  # 长内容时导航栏置顶
  sticky: true
  transition:
    tabs: true
    labels: true

# PDF 标签
pdf:
  enable: false
  height: 500px

# Mermaid 流程图
mermaid:
  enable: true
  theme:
    light: neutral
    dark: dark

# WaveDrom 数字电路图
wavedrom:
  enable: false


# ---------------------------------------------------------------
# 第三方插件和服务
# 文档: https://theme-next.js.org/docs/third-party-services/
# 更多插件: https://github.com/next-theme/awesome-next
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# 数学公式渲染
# 文档: https://theme-next.js.org/docs/third-party-services/math-equations
# 依赖: hexo-filter-mathjax 或 hexo-renderer-kramed
# 注意: 请按文档安装/卸载对应的渲染器
# ---------------------------------------------------------------

math:
  # 是否每页都加载（false 则仅加载 front-matter 中标记 mathjax: true 的页面）
  every_page: true

  mathjax:
    enable: true
    # 可选值: none | ams | all
    tags: none

  katex:
    enable: false
    copy_tex: false


# ---------------------------------------------------------------
# 外部库
# 文档: https://theme-next.js.org/docs/third-party-services/external-libraries
# ---------------------------------------------------------------

# PJAX - 无刷新页面导航（Ajax 局部加载）
pjax: true

# FancyBox - 图片灯箱效果（点击放大）
fancybox: true

# Medium Zoom - 图片缩放（与 fancybox 二选一）
mediumzoom: false

# 图片懒加载
lazyload: true

# 盘古之白 - 自动在中文和半角字符间插入空格
pangu: true

# Quicklink - 视口内链接预加载
quicklink:
  enable: true
  home: true
  archive: true
  delay: true
  timeout: 3000
  priority: true


# ---------------------------------------------------------------
# 动画设置
# ---------------------------------------------------------------

# 页面过渡动画 (Animate.css)
# ⚠️ 兼容性问题: hexo-theme-next 8.27.0 中 async: true 会导致文章 visibility:hidden 不恢复
# 解决方案: 设置 async: false 或 enable: false
motion:
  enable: true
  async: false
  # 动画持续时间 (ms，8.27.0 新增字段，默认 200)
  duration: 200
  transition:
    # 所有可选动画: https://theme-next.js.org/animate/
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    # 仅 Pisces | Gemini 生效
    sidebar: fadeInUp

# 页面加载进度条 (Pace)
pace:
  enable: true
  color: purple
  theme: bounce

# 彩色丝带背景效果 (HTML5 Canvas)
canvas_ribbon:
  enable: true
  size: 300
  alpha: 0.6
  zIndex: -1


