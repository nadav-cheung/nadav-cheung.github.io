<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — 页面未找到</title>
  <style>
    .wrapper-404 *,
    .wrapper-404 *::before,
    .wrapper-404 *::after { margin: 0; padding: 0; box-sizing: border-box; }
    .wrapper-404 {
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
      background: var(--content-bg-color, #fff);
      border-radius: 12px;
      padding: 60px 40px 50px;
      box-shadow: 0 2px 16px rgba(0,0,0,.06);
    }
    .wrapper-404 .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      color: var(--brand-color, #555);
      letter-spacing: -2px;
      margin-bottom: 8px;
    }
    .wrapper-404 .title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-color, #333);
      margin-bottom: 12px;
    }
    .wrapper-404 .desc {
      font-size: 15px;
      color: var(--custom-text-muted, #777);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .wrapper-404 .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .wrapper-404 .btn {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      transition: all .2s;
      cursor: pointer;
      border: none;
    }
    .wrapper-404 .btn-primary {
      background: var(--brand-color, #555);
      color: #fff;
    }
    .wrapper-404 .btn-primary:hover { background: var(--brand-hover-color, #333); }
    .wrapper-404 .btn-outline {
      background: var(--content-bg-color, #fff);
      color: var(--brand-color, #555);
      border: 1px solid var(--custom-border-color, #d0d0d0);
    }
    .wrapper-404 .btn-outline:hover { border-color: var(--brand-color, #555); color: var(--brand-hover-color, #333); }
    .wrapper-404 .divider {
      width: 40px; height: 2px;
      background: var(--custom-border-color, #e8e8e8);
      margin: 28px auto;
    }
    .wrapper-404 .hint {
      font-size: 13px;
      color: var(--custom-text-muted, #999);
      margin-top: 24px;
    }
  </style>
</head>
<body>
<div class="wrapper-404">
  <div class="code">404</div>
  <div class="title">页面未找到</div>
  <div class="desc">
    你访问的页面不存在、已被移动或链接失效。<br>
    试试返回首页，或者用右上角搜索功能查找内容。
  </div>
  <div class="actions">
    <a class="btn btn-primary" href="/">回到首页</a>
    <a class="btn btn-outline" href="/archives/">文章归档</a>
  </div>
  <div class="divider"></div>
  <div class="hint">
    如果这是从站内链接跳转过来的，<br>请在评论区告知作者修复。
  </div>
</div>
</body>
</html>
