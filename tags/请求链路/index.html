  function initBookshelf() {
    var old = document.getElementById('bookshelf');
    if (old) old.remove();

    var path = window.location.pathname;
    var isHome = path === '/' || /^\/page\/\d+\/?$/.test(path);
    if (!isHome) return;

    var tpl = document.getElementById('bookshelf-tpl');
    if (!tpl) return;

    var clone = tpl.content.cloneNode(true);

    var dataEl = document.getElementById('category-data');
    if (dataEl) {
      try {
        var counts = JSON.parse(dataEl.textContent);
        clone.querySelectorAll('[data-category]').forEach(function(el) {
          var cat = el.getAttribute('data-category');
          if (counts[cat]) el.textContent = counts[cat] + ' 章';
        });
      } catch(e) {}
    }

    var posts = document.querySelector('.posts-expand');
    if (!posts) return;

    var firstPost = posts.querySelector('.post-block');
    if (firstPost) {
      posts.insertBefore(clone, firstPost);
    } else {
      posts.appendChild(clone);
    }
  }

  // 降低回到顶部按钮出现阈值（默认 5% 对大文章太高）
  function fixBackToTop() {
    var btn = document.querySelector('.back-to-top');
    if (!btn) return;
    var onScroll = function () {
      var pct = document.body.scrollHeight > window.innerHeight
        ? 100 * window.scrollY / (document.body.scrollHeight - window.innerHeight)
        : 0;
      btn.classList.toggle('back-to-top-on', window.scrollY > 150 || Math.round(pct) >= 5);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  fixBackToTop();
  initBookshelf();
  document.addEventListener('pjax:complete', function () { initBookshelf(); fixBackToTop(); });
  document.addEventListener('pjax:popstate', function () { initBookshelf(); fixBackToTop(); });
})();</script>
